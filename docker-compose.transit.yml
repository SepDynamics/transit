services:
  valkey:
    image: redis:7-alpine
    container_name: transit-sentinel-valkey
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    mem_limit: 900m
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data

  archive:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: transit-sentinel-archive
    restart: unless-stopped
    mem_limit: 384m
    environment:
      PYTHONPATH: /app
      TRANSIT_ARCHIVE_INTERVAL_SECONDS: "30"
    volumes:
      - ./scripts:/app/scripts:ro
      - ./src:/app/src:ro
      - ./data:/app/data
      - ./logs/transit:/app/logs
    command: ["python3", "/app/scripts/transit/archive.py"]

  ingest:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: transit-sentinel-ingest
    restart: unless-stopped
    mem_limit: 768m
    environment:
      VALKEY_URL: redis://valkey:6379/0
      PYTHONPATH: /app
      TRANSIT_INGEST_INTERVAL_SECONDS: "5"
      TRANSIT_HISTORY_RETENTION: "720"
      TRANSIT_HISTORY_INTERVAL_SECONDS: "30"
      TRANSIT_SNAPSHOT_CACHE_TTL_SECONDS: "10"
    volumes:
      - ./scripts:/app/scripts:ro
      - ./src:/app/src:ro
      - ./data:/app/data
      - ./logs/transit:/app/logs
    depends_on:
      - valkey
      - archive
    command: ["python3", "/app/scripts/transit/ingest.py"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: transit-sentinel-api
    restart: unless-stopped
    mem_limit: 900m
    environment:
      VALKEY_URL: redis://valkey:6379/0
      TRANSIT_API_PORT: "8000"
      TRANSIT_SYSTEM_NAME: "MBTA"
      TRANSIT_API_CACHE_TTL_SECONDS: "5"
      TRANSIT_STORE_READ_CACHE_TTL_SECONDS: "5"
      TRANSIT_API_CACHE_MAX_ENTRIES: "24"
      TRANSIT_API_MAX_CONCURRENT_REQUESTS: "8"
      PYTHONPATH: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./src:/app/src:ro
      - ./logs/transit:/app/logs
    depends_on:
      - valkey
      - ingest
    ports:
      - "8000:8000"
    command: ["python3", "/app/scripts/transit/api.py"]

  api-demo:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: transit-sentinel-api-demo
    restart: unless-stopped
    mem_limit: 900m
    environment:
      VALKEY_URL: redis://valkey:6379/0
      TRANSIT_API_PORT: "8000"
      TRANSIT_SYSTEM_NAME: "Transit Sentinel Demo"
      TRANSIT_API_CACHE_TTL_SECONDS: "5"
      TRANSIT_STORE_READ_CACHE_TTL_SECONDS: "5"
      TRANSIT_API_CACHE_MAX_ENTRIES: "24"
      TRANSIT_API_MAX_CONCURRENT_REQUESTS: "8"
      PYTHONPATH: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./src:/app/src:ro
      - ./logs/transit:/app/logs
    depends_on:
      - valkey
    ports:
      - "8000:8000"
    command: ["python3", "/app/scripts/transit/api.py"]
    profiles: ["demo"]

  frontend:
    build:
      context: ./apps/frontend
    container_name: transit-sentinel-frontend
    restart: unless-stopped
    mem_limit: 192m
    environment:
      API_URL: ""
      SERVER_NAME: "_"
      BACKEND_UPSTREAM: "http://api:8000"
    depends_on:
      - api
    ports:
      - "8080:80"

  frontend-demo:
    build:
      context: ./apps/frontend
    container_name: transit-sentinel-frontend-demo
    restart: unless-stopped
    mem_limit: 192m
    environment:
      API_URL: ""
      SERVER_NAME: "_"
      BACKEND_UPSTREAM: "http://api-demo:8000"
    depends_on:
      - api-demo
    ports:
      - "8080:80"
    profiles: ["demo"]

volumes:
  valkey-data:
    driver: local
