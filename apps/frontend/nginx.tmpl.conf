server {
    listen 443 ssl;
    http2 on;
    server_name __SERVER_NAME__;

    ssl_certificate __CERT_BASE__/fullchain.pem;
    ssl_certificate_key __CERT_BASE__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream __BACKEND_UPSTREAM__;

    root /usr/share/nginx/html;
    index index.html index.htm;

    include /etc/nginx/includes/security_headers_https.conf;
    include /etc/nginx/includes/cache_static.conf;
    include /etc/nginx/includes/api_proxy.conf;
    include /etc/nginx/includes/react_router.conf;
    include /etc/nginx/includes/health.conf;
}

server {
    listen 80;
    server_name __SERVER_NAME__;

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name _ localhost;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream __BACKEND_UPSTREAM__;

    root /usr/share/nginx/html;
    index index.html index.htm;

    include /etc/nginx/includes/security_headers_http.conf;
    include /etc/nginx/includes/cache_static.conf;
    include /etc/nginx/includes/api_proxy.conf;
    include /etc/nginx/includes/react_router.conf;
    include /etc/nginx/includes/health.conf;
}
