# Production host override for the Compose-managed Sentinel service behind Caddy.
# Keeps app ports on loopback and disables replay/archive serving.
services:
  valkey:
    command: ["redis-server", "--appendonly", "no", "--save", "300", "1", "--maxmemory", "1024mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 1200m
    ports: !override
      - "127.0.0.1:6379:6379"

  archive:
    environment:
      TRANSIT_AGENCY: "lametro"
      TRANSIT_SYSTEM_NAME: "LA Metro"
      TRANSIT_ARCHIVE_ROOT: "/app/data/feeds/lametro"
      TRANSIT_ARCHIVE_CURRENT_ONLY: "1"
      SWIFTLY_API_KEY: "${SWIFTLY_API_KEY:-}"

  api:
    environment:
      # Keep rider-facing endpoints live by default while allowing the curated
      # LA case-pack traces to support replay and operator comparison views.
      TRANSIT_REPLAY_ENABLED: "1"
      TRANSIT_AGENCY: "lametro"
      TRANSIT_SYSTEM_NAME: "LA Metro Live"
      TRANSIT_API_CACHE_TTL_SECONDS: "15"
      TRANSIT_API_CACHE_MAX_ENTRIES: "6"
      TRANSIT_API_SCORECARD_CACHE_TTL_SECONDS: "60"
      TRANSIT_API_SCORECARD_MAX_LIMIT: "60"
      TRANSIT_API_SCORECARD_CACHE_MAX_LIMIT: "240"
      TRANSIT_API_MAX_CONCURRENT_REQUESTS: "4"
      TRANSIT_API_REQUEST_QUEUE_SIZE: "8"
      TRANSIT_STORE_READ_CACHE_TTL_SECONDS: "2"
      TRANSIT_API_REQUIRE_AUTH: "${TRANSIT_API_REQUIRE_AUTH:-1}"
      TRANSIT_API_TOKENS: "${TRANSIT_API_TOKENS:-}"
    ports: !override
      - "127.0.0.1:8000:8000"

  frontend:
    environment:
      # This overlay is the public status host, never the Operations console.
      OPS_CONSOLE_ENABLED: "0"
      # The public runtime config is browser-visible; never place an API
      # credential in this deployment, even when one exists in the host env.
      API_BEARER_TOKEN: ""
    ports: !override
      - "127.0.0.1:8080:80"

  ingest:
    environment:
      TRANSIT_AGENCY: "lametro"
      TRANSIT_SYSTEM_NAME: "LA Metro"
      # Discovery evidence is collected only during explicit calibration runs.
      # The normal public stack keeps current state in Valkey without writing
      # multi-gigabyte historical JSONL snapshots to the droplet.
      TRANSIT_EVIDENCE_ROOT: ""
      TRANSIT_GTFS_STATIC_PATH: "/app/data/feeds/lametro/current/lametro_gtfs.zip"
      TRANSIT_GTFS_RT_VEHICLE_POSITIONS_PATH: "/app/data/feeds/lametro/current/VehiclePositions_enhanced.json"
      TRANSIT_GTFS_RT_TRIP_UPDATES_PATH: "/app/data/feeds/lametro/current/TripUpdates_enhanced.json"
      TRANSIT_GTFS_RT_ALERTS_PATH: "/app/data/feeds/lametro/current/Alerts_enhanced.json"
      TRANSIT_GTFS_LIGHTWEIGHT: "1"
      TRANSIT_INGEST_INTERVAL_SECONDS: "20"
      TRANSIT_HISTORY_RETENTION: "120"
      TRANSIT_HISTORY_INTERVAL_SECONDS: "60"
      TRANSIT_HISTORY_TTL_SECONDS: "7200"
      TRANSIT_SNAPSHOT_CACHE_TTL_SECONDS: "120"
      TRANSIT_READ_MODELS_ENABLED: "1"
      TRANSIT_READ_MODEL_SCORECARD_LIMIT: "60"
      TRANSIT_READ_MODEL_TRENDS_LIMIT: "6"
      TRANSIT_READ_MODEL_TRENDS_WINDOW: "24"

  notify:
    environment:
      TRANSIT_NOTIFY_INTERVAL: "${TRANSIT_NOTIFY_INTERVAL:-30}"
      TRANSIT_NOTIFY_MIN_SEVERITY: "${TRANSIT_NOTIFY_MIN_SEVERITY:-warning}"
